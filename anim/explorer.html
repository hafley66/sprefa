<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sprefa · type explorer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #2e3440; color: #d8dee9;
                   font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
      #cy { position: absolute; inset: 0; }
      #bar { position: absolute; top: 0; left: 0; right: 0; z-index: 10;
             display: flex; gap: 8px; align-items: center; padding: 8px 12px;
             background: rgba(46,52,64,.85); backdrop-filter: blur(4px); }
      button { background: #3b4252; color: #e5e9f0; border: 1px solid #4c566a;
               border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
      button:hover { background: #434c5e; }
      #hint { color: #81a1c1; margin-left: auto; }
      .legend { display: flex; gap: 12px; align-items: center; }
      .legend span { display: inline-flex; gap: 5px; align-items: center; }
      .dot { width: 11px; height: 11px; border: 1px solid #2e3440; display: inline-block; }
      #search { background: #3b4252; color: #e5e9f0; border: 1px solid #4c566a;
                border-radius: 6px; padding: 5px 8px; font: inherit; width: 160px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <strong>type map</strong>
      <input id="search" placeholder="seed a type, e.g. Engine" />
      <button id="reset">reset to roots</button>
      <button id="collapse">collapse all</button>
      <span class="legend">
        <span><i class="dot" style="background:#a3be8c"></i>struct</span>
        <span><i class="dot" style="background:#b48ead"></i>enum</span>
        <span><i class="dot" style="background:#4c566a"></i>external</span>
      </span>
      <span id="hint">click a node to expand its dependencies</span>
    </div>
    <div id="cy"></div>
    <script type="module" src="/src/explorer.jsx"></script>
  </body>
</html>
