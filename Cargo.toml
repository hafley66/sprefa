# Root workspace. The shipping crate is `sprefa-dl` (binary `dl`) in v5/; the
# prior iterations v3/ and v4/ are kept for design-recovery and are NOT built
# here (excluded). A root manifest is what lets `cargo install --git <url>
# sprefa-dl --bin dl` resolve the subdir crate, and what cargo-dist anchors on.
[workspace]
resolver = "2"
members = ["v5", "v5/tree-sitter-dl"]
exclude = ["v3", "v4", "v5/src/v5cozokuzu"]

# Hoisted from v5/Cargo.toml (profiles in a non-root member are ignored with a
# warning): keep debuginfo off for faster dev/test builds.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
