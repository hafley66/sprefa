# No [workspace] table: `hafley-rs` is a symlink inside this directory and a
# workspace root here would claim `hafley-rs/crates/soopy` as its own member.
# `sqlite_ivm` is a gitignored symlink to the sibling checkout of hafley66/sqlite_ivm.
[package]
name = "dl8"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
autotests = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hafley-observe = { path = "sqlite_ivm/hafley-rs/crates/hafley-observe" }
indexmap = "2"
ivm-ir = { path = "sqlite_ivm/crates/ivm-ir" }
ivm-rxjs = { path = "sqlite_ivm/crates/ivm-rxjs" }
ivm-engine = { path = "sqlite_ivm/crates/ivm-engine" }
ivm-dd = { path = "sqlite_ivm/crates/ivm-dd" }
ivm-duckdb = { path = "sqlite_ivm/crates/ivm-duckdb", optional = true }
ivm-sqlite = { path = "sqlite_ivm/crates/ivm-sqlite" }
ordered-float = "3"
pretty = "0.12.5"
notify-debouncer-full = "0.7"
rusqlite = { version = "0.40", features = ["bundled", "limits", "load_extension", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soopy = { path = "sqlite_ivm/hafley-rs/crates/soopy" }
tracing = "0.1"
tree-sitter = "0.27"
reqwest = "0.12"
bytes = "1"
blake3 = "1"
parking_lot = "0.12"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
hashbrown = "0.16"
smallvec = "1"

[features]
# `DL8_ENGINE=ir:duckdb`: drives an external OpenIVM DuckDB CLI (IVM_DUCKDB_CLI,
# IVM_DUCKDB_EXTENSION). Off by default.
duckdb = ["dep:ivm-duckdb"]

[build-dependencies]
cc = "1"

[dev-dependencies]
libc = "0.2"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
tracing-subscriber = "0.3"

# opt-level 0 made `dl8 compile fixtures/openapi/todo.dl7` 13x slower than release
# (1.81 s vs 0.13 s, 2026-09-18) and every lane times against the debug binary.
[profile.dev]
opt-level = 1

# Dependencies optimized once; tests drive them hard.
[profile.dev.package."*"]
opt-level = 3
