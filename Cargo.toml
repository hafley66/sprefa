# No [workspace] table: `hafley-rs` is a symlink inside this directory and a
# workspace root here would claim `hafley-rs/crates/soopy` as its own member.
# `sqlite_ivm` is a gitignored symlink to the sibling checkout of hafley66/sqlite_ivm.
[package]
name = "dl8"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
hafley-observe = { version = "0.1.1", registry = "hafley" }
indexmap = "2"
ordered-float = "3"
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soopy = { path = "hafley-rs/crates/soopy" }
tracing = "0.1"
tree-sitter = "0.27"
ureq = "3.4"

[build-dependencies]
cc = "1"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["load_extension"] }

# opt-level 0 made `dl8 compile fixtures/openapi/todo.dl7` 13x slower than release
# (1.81 s vs 0.13 s, 2026-09-18) and every lane times against the debug binary.
[profile.dev]
opt-level = 1
