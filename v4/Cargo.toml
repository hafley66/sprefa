[package]
name = "v4"
version = "0.1.0"
edition = "2021"

[lib]
name = "v4"
path = "src/lib.rs"

[dependencies]
ast-grep-core     = "0.36"
ast-grep-language = { version = "0.36", default-features = false, features = ["builtin-parser", "tree-sitter-rust", "tree-sitter-c", "tree-sitter-cpp"] }
blake3            = "1"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
futures           = "0.3"
async-trait       = "0.1"
async-stream      = "0.3"
anyhow            = "1"
tikv-jemallocator = "0.6"
ignore            = "0.4"
libc              = "0.2"
rayon             = "1"
tokio-stream      = "0.1"
differential-dataflow = "0.12"
timely            = "0.12"
rusqlite          = { version = "0.32", features = ["bundled"] }
regex             = "1"
tree-sitter       = "0.24"
tree-sitter-json    = "0.24"
tree-sitter-yaml    = "0.7"
tree-sitter-toml-ng = "0.7"
globset             = "0.4"
rustc-hash          = "2"
lsp-types         = "0.97"
streaming-iterator = "0.1"
cc                = "1"
effect_runtime    = { path = "../v3/crates/effect_runtime", default-features = false, features = ["sqlite"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
tree-sitter-rust = "0.23"

[[bin]]
name = "v4-bench"
path = "src/bin/v4_bench.rs"
