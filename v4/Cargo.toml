[package]
name = "v4"
version = "0.1.0"
edition = "2021"

[dependencies]
ast-grep-core     = "0.36"
ast-grep-language = { version = "0.36", default-features = false, features = ["builtin-parser", "tree-sitter-rust"] }
blake3            = "1"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures           = "0.3"
async-trait       = "0.1"
async-stream      = "0.3"
anyhow            = "1"

[[bin]]
name = "v4-proto"
path = "src/main.rs"
