[package]
name = "v4"
version = "0.1.0"
edition = "2021"
# sprf fixtures in v4/examples are not cargo example bins
autoexamples = false

[features]
default = ["ghcache"]
ghcache = []

[lib]
name = "v4"
path = "src/lib.rs"

[dependencies]
ast-grep-core     = "0.36"
ast-grep-config   = "0.36"
ast-grep-language = { version = "0.36", default-features = false, features = ["builtin-parser", "tree-sitter-rust", "tree-sitter-c", "tree-sitter-cpp"] }
blake3            = "1"
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "signal"] }
futures           = "0.3"
async-trait       = "0.1"
async-stream      = "0.3"
anyhow            = "1"
tikv-jemallocator = "0.6"
ignore            = "0.4"
libc              = "0.2"
rayon             = "1"
tokio-stream      = "0.1"
differential-dataflow = "0.12"
timely            = "0.12"
rusqlite          = { version = "0.32", features = ["bundled"] }
regex             = "1"
tree-sitter       = "0.24"
tree-sitter-sprefa = { path = "crates/tree-sitter-sprefa" }
sprefa-extract     = { path = "crates/sprefa-extract" }
tree-sitter-json    = "0.24"
tree-sitter-yaml    = "0.7"
tree-sitter-toml-ng = "0.7"
globset             = "0.4"
rustc-hash          = "2"
lsp-types         = "0.97"
streaming-iterator = "0.1"
serde_json        = "1"
serde_yaml        = "0.9.34"
cc                = "1"
effect_runtime    = { path = "../v3/crates/effect_runtime", default-features = false, features = ["sqlite"] }
app_host          = { path = "app_host" }
tower             = { version = "0.5", features = ["util"] }
thiserror         = "1"
axum              = "0.8"
http-body-util    = "0.1"
bytes             = "1"
serde             = { version = "1", features = ["derive"] }
toml              = "0.8"
reqwest           = { version = "0.12", default-features = false, features = ["json"] }
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }
lru               = "0.12"
dashmap           = "6"
thread_local      = "1"
git2              = { version = "0.19", default-features = false }
memchr            = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
tree-sitter-rust = "0.23"
v3_effect_runtime_v2_fact_store = { path = "crates/v3_effect_runtime_v2_fact_store" }

[[bin]]
name = "v4-bench"
path = "src/bin/v4_bench.rs"

[[bin]]
name = "sprefa-run"
path = "src/bin/sprefa-run.rs"

[[bin]]
name = "sprefa-daemon"
path = "src/bin/sprefa-daemon.rs"

[[bin]]
name = "cursor-codec-stress"
path = "src/bin/cursor_codec_stress.rs"

[[bin]]
name = "sqlite-queue-stress"
path = "src/bin/sqlite_queue_stress.rs"
