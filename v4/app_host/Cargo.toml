[package]
name = "app_host"
version = "0.1.0"
edition = "2021"
description = "Generic Provider/Service/Transport scaffold. No sprf knowledge."

[dependencies]
tower      = { version = "0.5", features = ["util"] }
tokio      = { version = "1",   features = ["sync", "rt", "macros", "net", "io-util", "time"] }
futures    = "0.3"
thiserror  = "1"
serde      = { version = "1",   features = ["derive"] }
bincode    = "1"

[dev-dependencies]
tokio    = { version = "1", features = ["full"] }
tower    = { version = "0.5", features = ["util"] }
tempfile = "3"
