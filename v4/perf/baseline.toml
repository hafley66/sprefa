# ════════════════════════════════════════════════════════════════════
# CONTENT-HASH FIX (feat/memo-content-stale off feat/memo-perf-fix).
# Staleness oracle is now blake3(input file bytes) vs the hash
# recorded when the component last read it (`Memo::probe_ch` ->
# `is_stale_content`, v4/src/memo.rs). It does NOT consult
# `FactStoreClock`/`gen_seen`/any event bump, so it is correct on the
# one-shot CLI. The memo seam IS now installed on the primary CLI
# expand (v4/src/app.rs). `_memo_deps` carries new `content_id` +
# `source_path` columns; the fingerprint is the same blake3 the store
# mints at intern time (no second hashing scheme).
#
# Result: replay fires AND the edit is detected. Incremental skips the
# tree-sitter parse for the 63481 unchanged files (ast stage rows
# 63482 -> 1, ast parse_ms 18600.9 -> 0.8) while still re-reading
# 1.3GB to recompute hashes (expected/accepted). The "before" column
# is the seam-OFF full-recompute path ([postfix.*.branch]: incremental
# 53.45s) — the only CORRECT CLI behavior prior to this fix.
#
# Measured this session, release --bin sprefa-run built in the
# worktree, --telemetry --fact-db <persistent>, linux fixture.
# Incremental edit: append one `printk("x");` to net/netfilter/
# xt_LED.c; fixture restored byte-exact after (git checkout; cmp OK
# vs pre-saved pristine; sha 033c1b3a...; dirty count back to the 13
# pre-existing files, xt_LED.c clean).
# ════════════════════════════════════════════════════════════════════

[contenthash.headline]
staleness_oracle             = "blake3(input file bytes) vs recorded hash; clock-independent"
seam_installed_on_cli        = true
cold_hits                    = 16627
