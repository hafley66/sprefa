# ════════════════════════════════════════════════════════════════════
# POST-FIX (feat/memo-perf-fix off feat/memo-bench2). Two seams fixed:
#   1. MEMO_DEPS writes batched (perf(v4): batch MEMO_DEPS writes).
#      Per-row `insert` N+1 -> one `insert_batch` per (owner,in_key)
#      drain. The cold/incr numbers ABOVE are the PRE-FIX baseline,
#      kept labeled; the numbers below are the SAME workload re-run
#      with the fix binary (release --bin sprefa-run in the worktree;
#      main comparison reuses the prebuilt main e47b0e95 binary).
#   2. Memo put/replay: ROOT-CAUSED, replay NOT enabled on the
#      one-shot CLI (no source-invalidation event layer; enabling it
#      drops edits — see fix(v4) commit body). `_memo_facts` stays 0
#      on this path BY DESIGN until an invalidation source exists.
# ════════════════════════════════════════════════════════════════════

