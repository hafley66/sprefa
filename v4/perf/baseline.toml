# Ph7 baseline — memo-active CALLED-rule bench.
#
# Workload: v4/bench/linux-called.sprf — a bodied source-scan rule with
# all-binder columns (auto_run), genuinely CALLED by a trailing
# `hits?(…) > lsp_warn(…)` query. `--root` reaches `fs` as the branch-2
# input cursor value. Materializes hits: 16627 rows on the linux fixture
# (16628 after the +1 printk incremental edit).
#
# Incremental edit: append exactly one
#   `void memobench_touch(void) { printk("x"); }`
# line to ONE .c file (init/init_task.c, 0 printk → 1), re-run the SAME
# script against the SAME persistent --fact-db. Fixture restored
# byte-exact after (git checkout; cmp-verified).

[meta]
machine        = "Darwin arm64, 8 cpu, 16 GiB"
fixture        = "v3/tests/smoke/.fixtures/linux  (~37k .c, 16627 printk sites)"
date           = "2026-05-18"
script         = "v4/bench/linux-called.sprf"
branch_bin     = "feat/memo-bench2 (Ph0–6 + fs-input-driven fix); release --bin sprefa-run"
main_bin       = "main e47b0e95 prebuilt release sprefa-run (no retraction chain)"
telemetry      = "--telemetry --fact-db <persistent>; --no-show-rows"

# ── headline ────────────────────────────────────────────────────────
# The retraction/memo machinery (this branch) keys SUPPORT/owner reconcile
# at the rule-graph layer, NOT the fs>ast source scan. For this workload
# the source op re-walks (fs seen=93299) and re-reads/re-parses
# (source_reads=63482, parses≈4495) the WHOLE tree on every run on BOTH
# branch and main — identical scan counters cold vs incremental. The
# memo does not skip source work here. On the branch the incremental
# run additionally pays the reconcile/SUPPORT-teardown cost over ~16k
# rows with NO scan savings, so branch incremental is SLOWER than branch
# cold. Main has no retraction layer: its incremental ≈ its cold (pure
# recompute, ~5s). Recompute-vs-replay ratio for this shape ≈ 1.0 on
# both sides (no replay at the scan layer); the branch's retraction
# overhead makes its incremental ~2.6x its own cold.

[headline]
branch_incr_over_branch_cold_wall = 2.57   # 51.60s / 20.10s — retraction overhead, no scan replay
main_incr_over_main_cold_wall     = 0.89   # 4.49s / 5.06s   — pure recompute, ~flat
scan_replay_observed              = false  # parses/source_reads identical cold↔incr both sides
note = "memo seam is owner/SUPPORT-keyed (Ph6), not source-scan-keyed; fs>ast is not memoized"

