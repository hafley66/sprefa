[package]
name    = "effect_runtime"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

# Framework-only dependencies. Anything that touches ast-grep, sqlite,
# git, regex, or a specific domain lives in the consumer crate, never
# in this one.
[dependencies]
tokio             = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
tokio-util        = "0.7"
rayon             = "1"
crossbeam-channel = "0.5"
arc-swap          = "1"
moka              = { version = "0.12", features = ["future"] }

# Intentionally absent: no jemalloc pin, no tracing, no serde. This
# crate stays neutral so consumers pick their own stack.
