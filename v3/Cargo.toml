[workspace]
resolver = "2"
members = [
    "crates/effect_runtime",
    "crates/pipeline",
    "crates/server",
    "crates/spine",
    "crates/sprefa_macros",
    "crates/sprefa_parse",
    "crates/tree-sitter-sprefa",
    "experiments/effect_proof",
    "experiments/lang_prototype",
]
# crates/sprefa is v2 carryover against v2's parse/op surface; not
# compatible with v3's new parse_parse + pipeline::Op. Kept on disk for
# cherry-picking (runner, DAG, server shapes) but out of the build.
exclude = [
    "crates/sprefa",
    "experiments/parse_experiment",
]

[workspace.package]
edition = "2021"
publish = false

# Pinned aggressively so benches reflect production-shaped builds.
# Inherit into each member via [profile.release.<member>] as needed.
[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
strip            = "symbols"
debug            = false
incremental      = false
overflow-checks  = false

[profile.bench]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
debug            = false
incremental      = false
