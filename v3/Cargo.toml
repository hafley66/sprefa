[workspace]
resolver = "2"
members = [
    "crates/effect_runtime",
    "crates/pipeline",
    "crates/server",
    "crates/spine",
    "crates/sprefa_macros",
    "crates/sprefa_parse",
    "crates/tree-sitter-sprefa",
]
# crates/sprefa is v2 carryover against v2's parse/op surface; not
# compatible with v3's new parse_parse + pipeline::Op. Kept on disk for
# cherry-picking (runner, DAG, server shapes) but out of the build.
# experiments/* are bench/POC code that the shipping binary does not
# need; out of the workspace so cargo build / cargo test ignore them.
exclude = [
    "crates/sprefa",
    "experiments/effect_proof",
    "experiments/lang_prototype",
    "experiments/parse_experiment",
]

[workspace.package]
edition = "2021"
publish = false

# Pinned aggressively so benches reflect production-shaped builds.
# Inherit into each member via [profile.release.<member>] as needed.
[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
strip            = "symbols"
debug            = false
incremental      = false
overflow-checks  = false

[profile.bench]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
debug            = false
incremental      = false

# ast-grep + tree-sitter parsing is the per-cursor hot path on every
# smoke and unit test. Run every third-party dependency at release
# optimization level even in dev so an iterative build does not pay the
# debug-codegen tax on syntax engines. Workspace members keep the
# default `opt-level = 0` so editing sprefa's own crates stays fast.
[profile.dev.package."*"]
opt-level = 3
