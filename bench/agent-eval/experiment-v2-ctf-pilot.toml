# experiment-v2-ctf-pilot.toml — the v2 CTF (capture-the-flag) pilot.
#
# NEW EXPERIMENT VERSION (protocol #3): v2 changes the PROMPT (the agent is now
# told to read a per-cell SKILL.md tool-inventory file first, then answer) and
# the task class (multi-hop dataflow inventory over a committed fixture, scored
# as set-F1, NOT a single seeded fault). A prompt change is a new version with
# its own results file; v0/v1 stay as they are.
#
# The symmetry (protocol #2) is preserved at the PROMPT level: the same prompt
# text runs in every cell; the ONLY difference is the SKILL.md placed at the
# fixture root — baseline cells get bash/grep navigation tips, +dl cells get the
# dl.what/dl.verb/dl.rows tool contract. The skill file IS the cell's tool
# inventory documentation, so "read SKILL.md then answer" is identical wording
# across cells and each cell learns exactly its own tools.
#
# Ground truth = fixtures/ctf-permissions/MANIFEST.json, generated by
# build_manifest.py from the committed fixture and committed BEFORE any model
# run (git history is the proof). dl never touches the key.
#
# Pilot cells: haiku-grep vs haiku-dl, 1 rep (sonnet is run separately on the
# single hardest task via experiment-v2-ctf-hardest.toml if budget allows).

version = "v2-ctf-pilot"
class = "CTF"
repo_root = "."
fixture = "fixtures/ctf-permissions"
manifest = "fixtures/ctf-permissions/MANIFEST.json"
reps = 1
timeout_secs = 240
parallelism = 3

note = "v2 CTF pilot: find every export-permission enforcement site across a TS+Rust fixture where the SAME concept is gated four different ways (flag / service / guard / config) plus decoys. Set-F1 vs a hand-built manifest committed before any run. New version: the prompt now orients the agent via a per-cell SKILL.md (baseline=grep tips, +dl=the dl tool contract); symmetric prompt text, asymmetric tool inventory by design. Cells haiku-grep vs haiku-dl, 1 rep. Negative results are a deliverable."

[filters]
score_window_lines = 2

[[models]]
id = "haiku"
claude_model = "haiku"

[[cells]]
name = "haiku-grep"
model = "haiku"
allowed_tools = "Bash,Read,Grep,Glob"
skill_file = "fixtures/ctf-permissions/skills/baseline.SKILL.md"
mcp = false

[[cells]]
name = "haiku-dl"
model = "haiku"
allowed_tools = "Bash,Read,Grep,Glob,mcp__dl__dl.what,mcp__dl__dl.verb,mcp__dl__dl.rows"
skill_file = "fixtures/ctf-permissions/skills/dl.SKILL.md"
mcp = true
