[workspace]

[package]
name = "dl8"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
hafley-observe = { version = "0.1", registry = "hafley" }
indexmap = "2"
libloading = "0.8"
ordered-float = "3"
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soopy = { path = "../hafley-rs/crates/soopy" }
tracing = "0.1"
tree-sitter = "0.27"
ureq = "3.4"

[build-dependencies]
cc = "1"

[dev-dependencies]
rusqlite = { version = "0.40", features = ["load_extension"] }
