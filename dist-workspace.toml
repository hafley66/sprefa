[workspace]
members = ["cargo:.", "cargo:v6/sprefa-extract"]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# release.yml adds the sibling hafley-rs checkout required by path dependencies.
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax). macOS only for
# now: `dl` depends unconditionally on the tray stack (tray-icon/tao), which
# needs GTK on Linux and is macOS-v1; add Linux/Windows once the tray is
# cfg-gated to macOS.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
