name: SQLite IVM
on:
  push:
    paths: ['sqlite_ivm/**', '.github/workflows/sqlite-ivm.yml']
  pull_request:
    paths: ['sqlite_ivm/**', '.github/workflows/sqlite-ivm.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux SQLite
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sqlite3 libsqlite3-dev
      - name: Select macOS SQLite
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install sqlite
          echo "SQLITE3_LIB_DIR=$(brew --prefix sqlite)/lib" >> "$GITHUB_ENV"
          echo "SQLITE3_INCLUDE_DIR=$(brew --prefix sqlite)/include" >> "$GITHUB_ENV"
          echo "SQLITE3=$(brew --prefix sqlite)/bin/sqlite3" >> "$GITHUB_ENV"
      - name: Fetch locked Rust dependencies
        run: |
          cargo fetch --locked --manifest-path sqlite_ivm/Cargo.toml
          cargo fetch --locked --manifest-path sqlite_ivm/bench/Cargo.toml
      - name: Rust and native acceptance tests
        run: bash sqlite_ivm/scripts/9_verify.sh
      - name: Shared SQLite and DD circuit acceptance
        env:
          IVM_ARMS: sqlite-plugin-delta,dd,sqlite-query
        run: bash sqlite_ivm/scripts/11_shootout.sh "$RUNNER_TEMP/sqlite-ivm-ci.jsonl"
      - name: Typed feature combinations against SQLite and DD
        run: bash sqlite_ivm/scripts/12_features.sh "$RUNNER_TEMP/sqlite-ivm-features"
      - name: Native values, cascades, concurrency, and rollback
        run: |
          case "$(uname -s)" in Darwin) library=libsqlite_ivm.dylib;; *) library=libsqlite_ivm.so;; esac
          bash sqlite_ivm/scripts/14_native_values.sh "$GITHUB_WORKSPACE/sqlite_ivm/target/release/$library"
      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-ivm-features-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/sqlite-ivm-features/*.jsonl
            ${{ runner.temp }}/sqlite-ivm-features/cases/*.json
          if-no-files-found: error
      - name: Build release archive
        run: bash sqlite_ivm/scripts/10_package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sqlite-ivm-${{ runner.os }}-${{ runner.arch }}
          path: |
            sqlite_ivm/dist/*
            ${{ runner.temp }}/sqlite-ivm-ci.jsonl
          if-no-files-found: error
  postgres-features:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: sqlite-ivm-features-Linux-X64
          path: ${{ runner.temp }}/sqlite-ivm-features
      - name: Build native pg_ivm 1.15
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-server-dev-16 build-essential
          git clone --depth 1 --branch v1.15 https://github.com/sraoss/pg_ivm.git "$RUNNER_TEMP/pg_ivm"
          make -C "$RUNNER_TEMP/pg_ivm" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config
          sudo make -C "$RUNNER_TEMP/pg_ivm" PG_CONFIG=/usr/lib/postgresql/16/bin/pg_config install
          npm ci --prefix sqlite_ivm/bench/shared --ignore-scripts
      - name: PostgreSQL query semantics and recorded pg_ivm behavior
        env:
          IVM_POSTGRES_PREFIX: /usr/lib/postgresql/16
        run: bash sqlite_ivm/scripts/15_pg_baseline.sh "$RUNNER_TEMP/sqlite-ivm-features"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-ivm-pg-feature-results
          path: ${{ runner.temp }}/sqlite-ivm-features/pg.jsonl
          if-no-files-found: error
