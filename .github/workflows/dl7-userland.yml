name: DL7 userland

on:
  push:
    paths: ['v7/**', '.github/workflows/dl7-userland.yml']
  pull_request:
    paths: ['v7/**', '.github/workflows/dl7-userland.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler-and-userland:
    runs-on: ubuntu-latest
    # Official swipl:10.0.2 linux/amd64 image, matching the local test runtime.
    container: swipl@sha256:ecae24e505a5216612361cacbc50b55a54bee333d5d54335bab5cf58b415f6bd
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify compiler runtime
        run: |
          swipl --version
          swipl -q -g "use_module(library(tableutil), [table_statistics/2]), halt"
      - name: Module, storage, application and binding tests
        run: >-
          swipl -q -g
          "load_files(['v7/test/2_module_system.test.pl',
          'v7/test/15_interned_storage.test.pl',
          'v7/test/16_storage_plain_field.test.pl',
          'v7/test/17_dl6_interned.test.pl',
          'v7/test/18_binding_symmetry.test.pl',
          'v7/test/19_lexical_binding.test.pl']),
          (run_tests -> halt(0); halt(1))"
      - name: Verify compiler performance gate
        run: |
          timeout 20 swipl -q -s v7/test/20_compiler_performance.test.pl -g run_tests -t halt
          timeout 20 swipl -q -s v7/bench/0_compiler_performance.pl -g main -t halt -- v7/test/fixtures/lexical_binding/7_nearest_shadow.dl7
