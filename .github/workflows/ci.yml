name: CI

# The gate for the sprefa v5 `dl` engine. Three things stay green:
#   1. the Rust suite (lib + the `it` integration target, which includes the
#      LSP transport test tests/it/lsp_protocol.rs and the dl-lints-dl
#      tests/it/dl_diag.rs);
#   2. `dl --check` over this repo's own `.dl/` rails (dogfood — the engine
#      runs its own lint rails);
#   3. the pre-commit hook stays wired to `dl --check`.
# The crate lives in v5/ (no root workspace yet), so every cargo call passes
# --manifest-path v5/Cargo.toml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: v5

      # Unit + integration suites. The `it` target carries the LSP smoke
      # (lsp_protocol.rs) and the self-validation tests; 4 tests are #[ignore]
      # (network / JDK / SCIP) and stay skipped here.
      - name: Unit tests (lib)
        run: cargo test --manifest-path v5/Cargo.toml --lib

      - name: Integration tests (it — includes LSP + dl_diag + gh-cache)
        run: cargo test --manifest-path v5/Cargo.toml --test it

      # Dogfood: the engine lints itself. Build the binary, then run the repo's
      # own discovery rails. Exit 0 = clean, 2 = a rail violation (a real
      # finding — fail), 1 = broken rails program (fail). --no-daemon forces the
      # in-process path (no socket/daemon in CI).
      - name: Build dl
        run: cargo build --manifest-path v5/Cargo.toml --release --bin dl

      - name: Dogfood rails (dl --check on this repo)
        run: ./v5/target/release/dl --check --no-daemon --root .

      # The pre-commit hook (.githooks/pre-commit, core.hooksPath=.githooks) must
      # stay wired to `dl --check`, so a contributor's commit hits the same gate.
      - name: Pre-commit hook integrity
        run: |
          test -x .githooks/pre-commit || { echo "::error::.githooks/pre-commit missing or not executable"; exit 1; }
          grep -q 'dl --check' .githooks/pre-commit || { echo "::error::pre-commit hook no longer runs 'dl --check'"; exit 1; }
          echo "pre-commit hook wired to 'dl --check'"
