name: CI

# v5 gates removed 2026-08-11 per user decree; v6 gate wired in 2026-08-11.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  v6-gates:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      # sprefa-extract and sprefa-engine-rs depend on `../../../hafley-rs/crates/soopy`
      # by path: the sibling must sit beside the workspace, out of checkout's `path:` reach.
      - name: Clone hafley-rs beside the workspace
        run: git clone --depth 1 https://github.com/hafley66/hafley-rs "$GITHUB_WORKSPACE/../hafley-rs"

      - name: Install SWI-Prolog
        run: brew install swi-prolog

      - name: Install just
        run: brew install just

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('v6/tsv2/pnpm-lock.yaml', 'v6/sprefa-store/js/pnpm-lock.yaml') }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'v6/sprefa-extract/Cargo.lock') }}

      - name: Install v6/tsv2 dependencies
        working-directory: v6/tsv2
        run: pnpm install --frozen-lockfile

      - name: Install v6/sprefa-store/js dependencies
        working-directory: v6/sprefa-store/js
        run: pnpm install --frozen-lockfile

      # Writes gen_emitted/ and compile/out/ for green-all's readers; sweep.sh's
      # own grading verdict is the allowlisted `sweep` leg's, not this step's.
      - name: Generate text-door corpus
        continue-on-error: true
        working-directory: v6/tsv2
        run: bash scripts/sweep.sh

      # Under the default `bash -e`, a red leg would end the job here and the
      # allowlist step below would decide nothing.
      - name: Run green-all gate
        id: gate
        continue-on-error: true
        working-directory: v6
        run: |
          set +e
          just green-all > green-all.log 2>&1
          rc=$?
          echo "green-all rc=$rc"
          cat green-all.log
          echo "raw_rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: green-all-log
          path: v6/green-all.log
          retention-days: 30

      # Pass/fail decided by the allowlist in CI-KNOWN-RED.md.
      - name: Decide pass/fail from known-red allowlist
        if: always()
        working-directory: v6
        run: |
          set -uo pipefail
          fail_legs() { grep '^FAIL ' green-all.log | awk '{print $2}'; }
          bad=0
          while IFS= read -r leg; do
            [ -n "$leg" ] || continue
            if ! grep -qE "^allow: ${leg}$" ../.github/CI-KNOWN-RED.md; then
              echo "UNALLOWED FAIL: ${leg}"
              bad=1
            else
              echo "allowed known-red: ${leg}"
            fi
          done < <(fail_legs)
          if [ "$bad" = "1" ]; then
            echo "job RED: a failing leg is not in the known-red allowlist"
            exit 1
          fi
          echo "job GREEN: every failing leg is in the known-red allowlist"
