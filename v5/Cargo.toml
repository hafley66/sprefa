[package]
name = "sprefa-v5"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dl"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
blake3 = "1"
notify = "6"
rayon = "1"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
streaming-iterator = "0.1"
ast-grep-core = "0.38"
ast-grep-language = "0.38"
