[package]
name = "sprefa-v5"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dl"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled", "functions", "trace"] }
regex = "1"
globset = "0.4"
ignore = "0.4"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
notify = "6"
rayon = "1"
syn = { version = "2", features = ["full", "visit"] }
# span-locations lets syn report 1-based line/col for declaration sites
# (TypeEntity.line) when parsing a file outside a proc-macro context.
proc-macro2 = { version = "1", features = ["span-locations"] }
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-c = "0.24"
tree-sitter-json = "0.24"
# ast-grep's kotlin grammar fork; already in the tree via ast-grep-language,
# so a direct dep adds no new transitive build.
tree-sitter-kotlin-sg = "0.4"
# MDeiml/tree-sitter-grammars markdown grammar. Two-parser split (block +
# inline); we use the block language for headings + fenced code blocks. The
# hand-rolled extractor it replaced lives in git history (commit preceding
# 730819a -> here).
tree-sitter-md = "0.5"
streaming-iterator = "0.1"
ast-grep-core = "0.38"
ast-grep-language = "0.38"
ast-grep-config = "0.38"
serde_yaml = "0.9"
lsp-server = "0.7.9"
lsp-types = "0.97.0"
oxc_resolver = "11.20.0"
toml = "1.1.2"
protobuf = "3.7"
scip = "0.7.1"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
oxc_allocator = "0.135.0"
oxc_parser = "0.135.0"
oxc_ast = "0.135.0"
oxc_span = "0.135.0"
oxc_ast_visit = "0.135.0"
