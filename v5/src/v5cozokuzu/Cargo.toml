[package]
name = "v5cozokuzu"
version = "0.1.0"
edition = "2021"

# This is a SEPARATE crate nested under v5/src/. The v5 crate does not declare
# it as a module, so v5's build never touches it. Each engine is behind a
# feature flag so a build failure in one (kuzu compiles C++) cannot block the
# other. Run with:
#   cargo run --features cozo-demo --bin cozo_demo
#   cargo run --features kuzu-demo --bin kuzu_demo

[dependencies]
# The canonical `cozo` crate's newest (0.7.6) is dep-rotted on a current
# toolchain. `cozo-ce` is the maintained community continuation; aliased to
# `cozo` so the demo's `use cozo::...` is unchanged.
cozo = { package = "cozo-ce", version = "0.7.13-alpha.3", optional = true }
kuzu = { version = "=0.6.1", optional = true }

[features]
default = []
cozo-demo = ["dep:cozo"]
kuzu-demo = ["dep:kuzu"]

[[bin]]
name = "cozo_demo"
required-features = ["cozo-demo"]

[[bin]]
name = "kuzu_demo"
required-features = ["kuzu-demo"]
