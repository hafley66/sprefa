[build]
# Eight lanes build at once on a 12-core machine; the per-process budget keeps
# the sum under the core count (load 54 measured with jobs unbounded). Raise
# only after measuring the lane count. Nightly-only flags (-Z threads, lld)
# stay out: CI builds on stable.
jobs = 3

[env]
RUST_TEST_THREADS = "4"
