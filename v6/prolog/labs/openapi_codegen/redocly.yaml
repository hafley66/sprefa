# Redocly CLI config for the emitted spec's validation receipt.
#
# `recommended` stays on -- it carries the structural `spec` rules, which are
# the ones that decide whether the emitted document is a valid OpenAPI 3.1
# document at all. Exactly two rules are turned off, each with a reason:
#
#   security-defined  the served engine binds 127.0.0.1 and has no auth of any
#                     kind today (serve/4_http.ts: no header is read on any
#                     branch). Emitting a `securitySchemes` block to satisfy a
#                     linter would put a claim in the spec that the server does
#                     not implement, which is the exact failure the parity gate
#                     exists to prevent. Auth is a card in the plan doc, not a
#                     lint suppression.
#
#   info-license      the repo has no license file to point at yet.
#
# Everything else -- operation ids, duplicated paths, unresolved $refs, bad
# media types, missing response descriptions -- stays a hard error.
extends:
  - recommended

rules:
  security-defined: off
  info-license: off
