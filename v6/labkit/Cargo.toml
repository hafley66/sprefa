# The golden harness. Every incremental-maintenance engine implements one trait;
# the harness sweeps scales, counts EVERYTHING (time, writes, recompute units,
# live/total cardinality, peak RSS, peak Rust-alloc), snapshots the query plan,
# fits the empirical Big-O slope of time and space, and cross-checks every engine's
# live-set digest for equivalence. A 5GB gun-to-head allocator caps the process.
[workspace]

[package]
name = "labkit"
version = "0.1.0"
edition = "2021"
publish = false

# The shipping SQLite engines (reach_dred.rs / cascade.rs) reach SQLite through
# sprefa-store (sea-orm) — SQLite lives in ONE crate now, no rusqlite here. salsa
# and differential-dataflow/timely are comparison ORACLES, both optional; a default
# build pulls just sprefa-store + sea-orm + libc.
[dependencies]
libc = "0.2"
sprefa-store = { path = "../sprefa-store" }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt"] }
libsqlite3-sys = "0.37"

# oracles, off by default:
salsa = { version = "0.28", optional = true }
differential-dataflow = { version = "0.25", optional = true }
timely = { version = "0.31", optional = true }

[features]
with-salsa = ["dep:salsa"]
with-dd = ["dep:differential-dataflow", "dep:timely"]

# the two examples that use the salsa oracle need the feature; everything else (the
# SQLite engines) builds on a default (sprefa-store + sea-orm) build.
[[example]]
name = "reconcile_table"
required-features = ["with-salsa"]
[[example]]
name = "grand_table"
required-features = ["with-salsa"]
