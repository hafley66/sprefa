# Standalone crate: its own [workspace] table decouples it from the v5 root
# workspace so `cargo test` here is fully isolated (the whole point: prove the
# v6 extraction leaf with no v5 tree in the build graph).
[workspace]

[package]
name = "sprefa-extract"
version = "0.1.0"
edition = "2021"
description = "v6 extraction leaf: a corpus at a version -> normalized graph facts. Sync, rayon-parallel, arena-mastered. No DB, no async."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# ast-grep-language ships the tree-sitter grammars for rust/ts/tsx/js/go in ONE
# dep; ast-grep-core is the parse + Node API. v5 carried these v0 -> v6 (src/sg.rs).
# Ported verbatim, not relitigated.
ast-grep-core = "0.38"
ast-grep-language = "0.38"
# oxc arena AST front-end for TS/JS (v5 carried these; src/graph/typegraph/ts).
# The Program<'a> borrows the Allocator + source text, so parse ties content to
# 'a (the GAT seam). Commit 2b: TypeF entities; commit 2c: the arrow-type sigs
# (oxc_ast_visit walks type annotations for the named references they reference).
oxc_allocator = "0.135"
oxc_parser = "0.135"
oxc_ast = "0.135"
oxc_ast_visit = "0.135"
oxc_span = "0.135"
oxc_syntax = "0.135"
# syn is the Rust AST front-end v5 carried (src/graph/typegraph/rust). The
# `full` feature parses Item::*; `visit` drives the call-site/call-def walks;
# `extra-traits` for derive Eq on AST nodes some helpers pattern-match. Ported
# verbatim, not relitigated. Line/col on spans lives on proc_macro2::Span
# (syn 2 dropped its `span-locations` feature), gated by proc-macro2's
# `span-locations`; v6 Span is byte offsets, bridged by the line_starts table
# in lang/rust.rs.
syn = { version = "2", features = ["full", "visit", "parsing", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# serde on the FLAT wire envelope only (never on the generic Node<F>). The store
# seam + the parity-golden normalize + the stdout JSONL all read this one shape.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# clap is BIN-only: gated behind `cli` so `cargo tree --lib` stays free of it.
# The bin adds only clap; the lib never touches it.
[dependencies.clap]
version = "4"
features = ["derive"]
optional = true

[features]
cli = ["dep:clap"]

[[bin]]
name = "extract"
path = "src/bin/extract.rs"
required-features = ["cli"]
