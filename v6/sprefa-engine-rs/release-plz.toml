# One release-plz.toml per Cargo manifest: the manifests are separate
# workspaces, and the package prefix keeps their tags apart (a bare `v*` tag
# would match v6.2.0). None of them is on crates.io, so versions come from
# git tags (`git_only`).
[workspace]
changelog_update = false
dependencies_update = false
publish = false
git_only = true
git_release_enable = true
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }}-v{{ version }}"
release_commits = "^(feat|fix|perf|refactor)(\\([^)]*\\))?(!)?:"
semver_check = true

[[package]]
name = "sprefa-engine-rs"
changelog_update = true
changelog_path = "CHANGELOG.md"
