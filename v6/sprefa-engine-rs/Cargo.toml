[workspace]

[package]
name = "sprefa-engine-rs"
version = "0.1.0"
edition = "2021"
description = "Rust runtime the emit_rust emitter lowers against: the IGenProgram equivalent, the SQL seam over rusqlite, and the tick engine ported from v6/tsv2/runtime/1_incremental.ts."

[dependencies]
anyhow = "1"
# The `dl6` bin's option table; already in the lock through soopy.
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled", "functions", "limits"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal", "time"] }
# 0.8 is the version whose `tokio::net::UnixListener` implements
# `axum::serve::Listener` (plans/2026-08-17-openapi-clap-uds.PLAN.md section 6).
axum = "0.8"
tokio-util = "0.7"
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sprefa-extract = { path = "../sprefa-extract" }
sprefa-rust-runtime-host = { path = "../../../sprefa-v6/0_runtime/1_rust_runtime_host" }
# Git pathspec file feeds and blob identities are owned by the standalone
# source mechanics crate. HostPlanData remains the emitted shell-shaped ABI.
soopy = { path = "../../../hafley-rs/crates/soopy" }
# The line diff behind `changed_line`. Measured against `git diff -U0` over 1200
# generated file pairs: see the commit body's candidate table.
imara-diff = "0.2"
# The one measurement path, matching sprefa-store: spans say which code ran and
# for how long, read through RUST_LOG. An engine with no spans cannot answer
# "where did the wall clock go", which is how a 5-host rail read as an
# extraction cost for a whole session when it was never that.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The workspace reader every cargo subcommand uses. Its MetadataCommand spawns
# the `cargo` binary itself, which is why the `cargo_targets` host needs no shell.
cargo_metadata = "0.23"
# Blocking sockets with their own pool: the host seam is sync, and a
# reqwest-blocking call inside the runtime's `block_on` panics.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# Already in this lock through sprefa-extract's manifest arm.
basic-toml = "0.1"
# The compile cache key, already in the lock through soopy and sprefa-store, so
# `dl6 run` adds no new dependency to reach a content-addressed cache.
blake3 = "1"
# The resident-set reading behind `tick_cost`, already in the lock through soopy.
# Rejected: memory-stats, a new lock entry for one number; hand mach/procfs FFI.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[features]
default = ["harness"]
harness = []

[dev-dependencies]
tempfile = "3"
# tests/dd_oracle_crosscheck.rs only. dbsp 0.337 lost the pick: it ICEs rustc
# 1.97.0-nightly, the toolchain this crate builds on. Candidate table in PR #438.
differential-dataflow = "0.25"
# dd does not re-export timely and the harness drives the worker directly.
timely = "0.31"
# One non-pooled connection per client needs no connector or URI layer, so raw
# hyper client-conn over a UnixStream, never hyperlocal.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[[bin]]
name = "emit_rust_harness"
path = "src/bin/emit_rust_harness.rs"
required-features = ["harness"]

[[bin]]
name = "dl6"
path = "src/bin/dl6.rs"
