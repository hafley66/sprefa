[workspace]

[package]
name = "sprefa-engine-rs"
version = "0.1.0"
edition = "2021"
description = "Rust runtime the emit_rust emitter lowers against: the IGenProgram equivalent, the SQL seam over rusqlite, and the tick engine ported from v6/tsv2/runtime/1_incremental.ts."

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
