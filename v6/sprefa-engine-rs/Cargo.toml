[workspace]

[package]
name = "sprefa-engine-rs"
version = "0.1.0"
edition = "2021"
description = "Rust runtime the emit_rust emitter lowers against: the IGenProgram equivalent, the SQL seam over rusqlite, and the tick engine ported from v6/tsv2/runtime/1_incremental.ts."

[dependencies]
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
futures = "0.3"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sprefa-extract = { path = "../sprefa-extract" }
sprefa-rust-runtime-host = { path = "../../../sprefa-v6/0_runtime/1_rust_runtime_host" }
# Git pathspec file feeds and blob identities are owned by the standalone
# source mechanics crate. HostPlanData remains the emitted shell-shaped ABI.
soopy = { path = "../../../hafley-rs/crates/soopy" }
# The line diff behind `changed_line`. Measured against `git diff -U0` over 1200
# generated file pairs: see the commit body's candidate table.
imara-diff = "0.2"

[features]
default = ["harness"]
harness = []

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "emit_rust_harness"
path = "src/bin/emit_rust_harness.rs"
required-features = ["harness"]
