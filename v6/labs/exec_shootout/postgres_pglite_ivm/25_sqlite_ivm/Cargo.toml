[package]
name = "sqlite-ivm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
rusqlite = { version = "=0.40.2", features = ["loadable_extension", "functions"] }
sqlite3-parser = "=0.17.0"
fallible-iterator = "=0.3.0"
serde_json = "=1.0.149"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.22", features = ["json"] }
