# Standalone crate (own [workspace] table = decoupled from the v5 root, like
# sprefa-store). The lab exists to answer ONE question with running code:
# is "FRP the core" vs "FRP the edge" actually lopsided in Rust, or is that
# an assertion? Two clean binaries + one gated attempt that WON'T compile.
[workspace]

[package]
name = "frp-lab"
version = "0.1.0"
edition = "2021"
publish = false
description = "Lab: does streaming the batch-relational CORE suffer in Rust while streaming the event EDGE stays clean? Prove it, don't assert it."

[dependencies]
# The edge pipeline's toolbox. Stream + StreamExt + a real work-stealing spawner
# (executor::ThreadPool) — enough to BOTH build the clean edge and expose the
# core's 'static wall. No tokio: futures' own executor keeps the lab a leaf.
futures = { version = "0.3", features = ["thread-pool"] }
# The batch core's parallelism — the thing streaming would shatter (one item at a
# time vs a slab). par_iter over &[File] is the whole point.
rayon = "1"
# getrusage peak RSS — to catch the resident Z-set blowing memory at 10M, the exact
# wall the store lab put the cascade on disk to avoid. macOS ru_maxrss is bytes.
libc = "0.2"

# The FRP-CORE attempt is gated OFF by default so `cargo build`/`cargo test` stay
# green. Turn it on to reproduce the compile wall:
#   cargo build --example core_frp_attempt --features frp-core-attempt
[features]
frp-core-attempt = []

[[example]]
name = "core_frp_attempt"
required-features = ["frp-core-attempt"]
