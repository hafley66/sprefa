# Standalone crate: its own [workspace] table keeps cargo from walking up into
# the v5 root workspace, so `cargo test` here stays isolated from the v5 tree.
[workspace]

[package]
name = "boop"
version = "0.1.0"
edition = "2021"
description = "cross-harness agent transcript reader: tail agent events from every harness on this machine as one stream"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# clap derive gives the self-describing --help, subcommand help, and shell
# completions this CLI exists to have. Chosen by the user (build-vs-buy, fixed).
clap = { version = "4", features = ["derive"] }
# The transcripts are JSONL; this is the credible reader.
serde = { version = "1", features = ["derive"] }
# preserve_order: a row's column order is its SELECT order, so `--format text`
# has one column order per kind defined where the query is, never a second list.
serde_json = { version = "1", features = ["preserve_order"] }
# Application-level errors; this is a binary, not a library API.
anyhow = "1"
# Resolve the claude home dir without XDG project-dir machinery.
dirs = "5"
# Walk ~/.claude/projects/{encoded-cwd}/*.jsonl; can skip subtrees.
walkdir = "2"
# Layer 0: process tree, cpu, rss, cwd in one cross-platform API.
sysinfo = "0.39"
# Layer 1: typed tmux command argv builder.
tmux_interface = "0.4"
# Layer 3: the SQLite store at ~/.agent/boop.db. `bundled` compiles SQLite in,
# so no system SQLite version can disagree with it. Applies the repo's
# surrogate-key law (interning natural TEXT keys to INTEGER ids).
rusqlite = { version = "0.40", features = ["bundled"] }
# Transcript timestamps parse against Rfc3339; hand-rolled date math is gone.
time = { version = "0.3", features = ["parsing", "formatting"] }

[lib]
name = "boop"
path = "src/lib.rs"

[[bin]]
name = "boop"
path = "src/main.rs"
