[package]
name = "v2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sprefa-server"
path = "src/bin/sprefa_server.rs"

[[bin]]
name = "sprefa-v2-lsp"
path = "src/bin/sprefa_v2_lsp.rs"

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "net", "signal", "fs"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
libsqlite3-sys = "0.30"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
bytes = "1"
rustc-hash = "2"
globset = "0.4"
regex = "1"
anyhow = "1"
git2 = "0.19"
toml = "0.8"
tree-sitter = "0.24"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
ast-grep-core = "0.36"
ast-grep-language = { version = "0.36", default-features = false, features = ["builtin-parser", "tree-sitter-rust", "tree-sitter-typescript"] }
async-trait = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
chrono = { version = "0.4", features = ["clock"] }
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "service"] }
tower = "0.5"
tower-service = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[workspace]
